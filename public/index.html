<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- interactive-widget: el layout encoge con el teclado virtual (sin esto el
       teclado tapa cursor y botonera); viewport-fit: habilita env(safe-area-inset-*) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Wibetunnel</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#16213e">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/overlays.css">
</head>
<body>
  <div id="login">
    <h1>Wibetunnel</h1>
    <div class="input-wrap">
      <input type="password" id="token" placeholder="Token de acceso" autofocus>
      <button id="btn-eye" type="button" aria-label="Mostrar token">&#x1F441;</button>
    </div>
    <button id="btn-connect">Conectar</button>
    <label id="remember-row" style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;margin-top:10px;opacity:.85;cursor:pointer;">
      <input type="checkbox" id="remember-token"> Recordar token en este dispositivo
    </label>
    <div id="error" class="error"></div>
  </div>

  <div id="terminal-container">
    <div id="header">
      <div id="toolbar">
        <span id="toolbar-title">WIBETUNNEL</span>
        <div id="toolbar-actions">
          <button id="btn-search" title="Buscar" aria-label="Buscar en terminal">&#x1F50D;</button>
          <button id="btn-files" title="Archivos" aria-label="File browser">&#x1F4C1;</button>
          <button id="btn-palette" title="Comandos" aria-label="Command palette">&#x2318;</button>
          <button id="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema"></button>
          <button id="btn-settings" title="Ajustes" aria-label="Ajustes">&#x2699;&#xFE0F;</button>
        </div>
      </div>
      <div id="tabs">
        <button id="tab-new" title="Nueva sesion" aria-label="Nueva sesion">+</button>
      </div>
    </div>
    <div id="shortcuts"></div>
    <div id="buttons">
      <button data-key="\x03">Cancel<br><small>Ctrl+C</small></button>
      <button data-key="\t">Tab</button>
      <button data-key="\x1b[A">&#x2191;</button>
      <button data-key="\x1b[B">&#x2193;</button>
      <button data-key="\r">Enter</button>
      <button id="btn-bottom" data-action="bottom" title="Ir al final" aria-label="Ir al final">&#x2913;</button>
      <button id="btn-copy" data-action="copy">Copy</button>
      <button id="btn-paste" data-action="paste">Paste</button>
    </div>
    <div id="terminals">
      <div id="search-bar">
        <input id="search-input" placeholder="Buscar..." autocomplete="off">
        <button id="search-prev" title="Anterior">&#x2191;</button>
        <button id="search-next" title="Siguiente">&#x2193;</button>
        <button id="search-close" title="Cerrar">&#x2715;</button>
      </div>
    </div>
  </div>

  <div id="paste-overlay">
    <textarea id="paste-input" placeholder="Pega aqui tu texto..."></textarea>
    <div class="paste-actions">
      <button class="btn-send" id="paste-send">Enviar</button>
      <button class="btn-cancel" id="paste-cancel">Cancelar</button>
    </div>
  </div>

  <div id="filebrowser">
    <div id="fb-box">
      <div id="fb-path"></div>
      <div id="fb-actions">
        <button id="fb-upload">&#x2912; Subir archivo</button>
        <input type="file" id="fb-file" hidden>
      </div>
      <ul id="fb-list"></ul>
    </div>
  </div>

  <div id="statuspanel">
    <div id="statuspanel-box">
      <div id="statuspanel-header">
        <span>Estado del servidor</span>
        <button id="statuspanel-close">&#x2715;</button>
      </div>
      <div id="statuspanel-body"></div>
    </div>
  </div>

  <div id="palette">
    <div id="palette-box">
      <input id="palette-input" placeholder="Buscar comando..." autocomplete="off">
      <ul id="palette-list"></ul>
    </div>
  </div>

  <div id="settings">
    <div id="settings-box">
      <div id="settings-header">
        <span>Ajustes</span>
        <button id="settings-close">&#x2715;</button>
      </div>
      <div id="settings-body">
        <div class="setting-group">
          <div class="setting-label">Tema</div>
          <div class="setting-row">
            <button class="setting-theme-btn" data-theme="dark">&#x1F319; Dark</button>
            <button class="setting-theme-btn" data-theme="light">&#x2600;&#xFE0F; Light</button>
            <button class="setting-theme-btn" data-theme="auto">&#x1F4BB; Auto</button>
          </div>
        </div>
        <div class="setting-group">
          <div class="setting-label">Tama&#xF1;o de fuente</div>
          <div class="setting-row setting-row-inline">
            <button id="settings-font-down">A-</button>
            <span id="settings-font-size">14</span>
            <button id="settings-font-up">A+</button>
          </div>
        </div>
        <div class="setting-group">
          <div class="setting-label">Fuente</div>
          <select id="settings-font-family">
            <option value="'Courier New', monospace">Courier New (predeterminada)</option>
            <option value="Consolas, 'Courier New', monospace">Consolas</option>
            <option value="'Menlo', Monaco, 'Courier New', monospace">Menlo / Monaco</option>
            <option value="monospace">System monospace</option>
          </select>
        </div>
        <div class="setting-group">
          <div class="setting-label">Notificaciones</div>
          <button id="settings-notif-toggle">&#x1F515; Desactivadas</button>
        </div>
        <div class="setting-group">
          <div class="setting-label">Mis snippets</div>
          <ul id="snippets-list"></ul>
          <div class="snippet-add-row">
            <input id="snippet-label-input" placeholder="Etiqueta" maxlength="20">
            <input id="snippet-cmd-input" placeholder="Comando">
            <button id="snippet-add">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="status">Reconectando...</div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit.js"></script>
  <script src="/vendor/xterm-addon-search.js"></script>
  <script src="/vendor/xterm-addon-webgl.js"></script>
  <script src="/vendor/xterm-addon-web-links.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
