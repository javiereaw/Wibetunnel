name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — el trinquete compara el baseline contra el histórico.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (builds node-pty)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Puertas con trinquete: el baseline solo puede bajar. Un fichero >500 LOC
      # o un ciclo de importación nuevo tumban el job. Va antes del E2E porque
      # es instantáneo y el E2E tarda minutos.
      #
      # Perfil 'fast', no 'full': el perfil full incluye dos puertas binarias
      # —`npm run lint` y `npm test`— que este mismo job ya corre arriba como
      # pasos con nombre propio. Correrlas dos veces es tiempo tirado, y los
      # pasos con nombre dan mejor atribución del fallo: en rojo se ve "Unit
      # tests", no "Puertas (trinquete)". El perfil fast deja solo las sondas
      # de python puro (~0,2 s) y no duplica nada.
      - name: Puertas (trinquete)
        run: python3 .gates/gates.py --profile fast

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          WIBE_TEST_PORT: '4021'

      - name: Upload E2E server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: /tmp/wibetunnel-e2e-server.log
          if-no-files-found: ignore
