name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — el trinquete compara el baseline contra el histórico.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (builds node-pty)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Puertas con trinquete: el baseline solo puede bajar. Un fichero >500 LOC
      # o un ciclo de importación nuevo tumban el job. Va antes del E2E porque
      # es instantáneo y el E2E tarda minutos.
      #
      # Perfil 'ci', no 'full': el perfil full incluye dos puertas binarias
      # —`npm run lint` y `npm test`— que este mismo job ya corre arriba como
      # pasos con nombre propio. Repetirlas es tiempo tirado y atribuye peor el
      # fallo: en rojo se leía "Puertas (trinquete)" en vez de "Unit tests".
      #
      # Y 'ci' en vez de 'fast' porque fast se llevaba por delante
      # `eslint-estructural`, el único ratchet que ningún paso duplica: el paso
      # "Lint" solo mira errores. En fast esa puerta quedaba viva solo en
      # local. 'ci' = todos los ratchets, ninguna binaria.
      # osv-scanner, que necesita la puerta 'vulns-dependencias'. Version FIJA y
      # sha256 comprobado: si el binario del release cambiase, este paso peta en
      # vez de ejecutar otra cosa. Los DATOS siguen frescos igual --- el escaner
      # consulta api.osv.dev en cada pasada; lo unico congelado es su codigo.
      #
      # Si falla la descarga, osv-scanner no esta y la puerta sale
      # INDETERMINADO, que tumba el job. Es lo correcto: "no he podido mirar"
      # no es "cero vulnerabilidades".
      - name: Instalar osv-scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSLf -o "$HOME/.local/bin/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Puertas (trinquete)
        run: python3 .gates/gates.py --profile ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          WIBE_TEST_PORT: '4021'

      - name: Upload E2E server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: /tmp/wibetunnel-e2e-server.log
          if-no-files-found: ignore
