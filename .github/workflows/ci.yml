name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — el trinquete compara el baseline contra el histórico.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (builds node-pty)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Puertas con trinquete: el baseline solo puede bajar. Un fichero >500 LOC
      # o una función compleja nueva tumban el job. Va antes del E2E porque es
      # instantáneo y el E2E tarda minutos.
      - name: Puertas (trinquete)
        run: python3 .gates/gates.py --profile full

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          WIBE_TEST_PORT: '4021'

      - name: Upload E2E server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: /tmp/wibetunnel-e2e-server.log
          if-no-files-found: ignore
